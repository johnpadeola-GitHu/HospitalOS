<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon-only variant: colors inverted from the main logo (which is
       red background, white plus, as used in the footer and every other
       in-app occurrence) — here it's white background, red plus, so the
       icon reads clearly as a small browser-tab/home-screen mark. -->
  <rect width="100" height="100" rx="20" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="19.25" fill="none" stroke="#E4E9F2" stroke-width="1.5"/>
  <rect x="39" y="13" width="22" height="74" rx="6" fill="#D6241C"/>
  <rect x="13" y="39" width="74" height="22" rx="6" fill="#D6241C"/>
</svg>
