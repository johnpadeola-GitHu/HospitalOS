<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Clean white field, softly rounded -->
  <rect width="100" height="100" rx="20" fill="#FFFFFF"/>

  <!-- Medical cross: two overlapping rounded rectangles, precise and bold -->
  <rect x="41" y="16" width="18" height="52" rx="5" fill="#D6241C"/>
  <rect x="16" y="41" width="52" height="18" rx="5" fill="#D6241C"/>

  <!-- Stethoscope: one continuous stroke, simple enough to read at 16px -->
  <path d="M30 74 v6 a12 12 0 0 0 12 12 h4 a12 12 0 0 0 12-12 v-6"
        fill="none" stroke="#D6241C" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="30" cy="70" r="4.4" fill="#D6241C"/>
  <circle cx="58" cy="92" r="5.2" fill="#D6241C"/>
  <circle cx="58" cy="92" r="2.1" fill="#FFFFFF"/>
</svg>
