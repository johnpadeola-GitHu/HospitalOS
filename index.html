<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- iOS "Add to Home Screen" reads this specifically — it does not use
         the SVG favicon above, so without this the home screen icon falls
         back to a screenshot of the page instead of the logo. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HospitalOS" />

    <!-- Android / general PWA install support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D6241C" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HospitalOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
